name: Manual Build Firmware
run-name: Build ESP32 DIY V1
on:
  workflow_dispatch:
    inputs:
      board:
        description: 目标板子名称
        required: true
        default: esp32-diy-v1
        type: choice
        options:
          - esp32-diy-v1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup PlatformIO
        uses: platformio/setup-platformio@v5

      - name: Build firmware
        run: |
          pio run -e ${{ github.event.inputs.board }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.board }}
          path: .pio/build/${{ github.event.inputs.board }}/firmware.bin

