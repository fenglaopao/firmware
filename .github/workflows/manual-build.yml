name: Manual Build Meshtastic Firmware
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform target name
        required: true
        default: esp32-diy-v1
      build_flags:
        description: Extra build flags
        required: false
        default: -DBATTERY_PIN=35 -DADC_MULTIPLIER=1.85 -DADC_ATTENUATION=ADC_ATTEN_DB_11

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: |
          pio run -e ${{ github.event.inputs.target }} ${{ github.event.inputs.build_flags }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.target }}
          path: .pio/build/${{ github.event.inputs.target }}/*.bin
