name: Manual Build Firmware
on:
  workflow_dispatch:
    inputs:
      pio_env:
        description: 'PIO环境名称'
        required: true
        default: 'esp32-diy-v1'
      platform:
        description: '平台'
        required: true
        default: 'esp32'
      version:
        description: '版本标记'
        required: true
        default: 'custom-build'

jobs:
  build:
    uses: ./.github/workflows/build_firmware.yml
    with:
      pio_env: ${{ github.event.inputs.pio_env }}
      platform: ${{ github.event.inputs.platform }}
      version: ${{ github.event.inputs.version }}
    env:
      EXTRA_BUILD_FLAGS: >
        -DBATTERY_PIN=35
        -DADC_MULTIPLIER=1.85
        -DADC_ATTENUATION=ADC_ATTEN_DB_11
        -DBUTTON_PIN=39
