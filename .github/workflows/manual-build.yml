name: Manual Build Meshtastic Firmware
on:
  workflow_dispatch:
    inputs:
      board:
        description: '目标主板，填 esp32-diy-v1'
        required: true
        default: esp32-diy-v1
      build_flags:
        description: 自定义编译参数
        required: false
        default: '-DBATTERY_PIN=35 -DADC_MULTIPLIER=1.85 -DADC_ATTENUATION=ADC_ATTEN_DB_11'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 安装Python，然后pip安装platformio（不再调用失效的platformio action）
      - name: Setup Python & Install PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: |
          pio run -e ${{ github.event.inputs.board }}
        env:
          PLATFORMIO_BUILD_FLAGS: ${{ github.event.inputs.build_flags }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.inputs.board }}
          path: |
            .pio/build/${{ github.event.inputs.board }}/firmware.bin


